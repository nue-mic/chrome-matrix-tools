name: 打包独立版 exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支/tag 有新推送时, 取消还在跑的旧构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 构建 (windows-latest)
    runs-on: windows-latest
    permissions:
      contents: write   # 仅 tag 触发时用于创建 Release
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 自包含单文件发布
        run: dotnet publish pack/pack.csproj -c Release -o dist

      - name: 校验产物
        id: verify
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem dist -Filter *.exe -File)
          if ($exe.Count -ne 1) { throw "预期 dist 下恰好 1 个 exe, 实际 $($exe.Count) 个" }
          $f  = $exe[0]
          $mb = [math]::Round($f.Length / 1MB, 1)
          Write-Host "产物   : $($f.Name)"
          Write-Host "体积   : $mb MB"
          Write-Host "版本   : $($f.VersionInfo.FileVersion)"
          Write-Host "产品名 : $($f.VersionInfo.ProductName)"
          # 自包含发布约 47MB; 明显偏小说明退化成了依赖框架的发布
          if ($f.Length -lt 20MB) { throw "产物仅 $mb MB, 不像自包含单文件发布" }
          "exe_path=$($f.FullName)" >> $env:GITHUB_OUTPUT
          "version=$($f.VersionInfo.FileVersion)" >> $env:GITHUB_OUTPUT

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Chrome多开生成器
          path: dist/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: 发布 Release (仅 tag 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          # GitHub 会剥掉 Release 附件名里的非 ASCII 字符 (中文名会变成 Chrome.exe),
          # 所以改用带版本号的 ASCII 名上传。
          $asset = "ChromeMatrixTools-$tag-win-x64.exe"
          Copy-Item -LiteralPath '${{ steps.verify.outputs.exe_path }}' -Destination $asset

          # 说明写文件再用 --notes-file, 避免多行字符串在命令行上被转义
          @(
            '自包含单文件版, 已把 .NET 运行时打包进去 —— 任何 64 位 Windows 双击即用, 无需安装 .NET。',
            '',
            '- 文件版本: ${{ steps.verify.outputs.version }}',
            '- 构建来源: ${{ github.sha }}',
            '- 下载后可改名成 `Chrome多开生成器.exe`, 功能不受文件名影响'
          ) | Set-Content -LiteralPath notes.md -Encoding utf8

          # 允许同一个 tag 重新发布: 已存在的 Release 先删掉, 保留 tag 本身
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --yes }
          gh release create $tag $asset --title $tag --notes-file notes.md
